spring.application.name=userService

spring.jpa.hibernate.ddl-auto=update    
spring.datasource.url=jdbc:mysql://mysql-db:3306/userservice?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Enable the swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
# Enable the api-docs custom path
springdoc.api-docs.path=/v3/api-docs
# Ensure the UI is enabled
springdoc.swagger-ui.enabled=true

logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

# Tell SpringDoc to ignore security-related parameters in the UI
springdoc.model-and-view-parameters-exclude=org.springframework.security.core.userdetails.UserDetails, com.example.userService.userService.models.entity.User

# ==========================================
# Actuator & Metrics Configuration
# ==========================================

# Expose the health check and prometheus metrics endpoints over the web
management.endpoints.web.exposure.include=health,prometheus

# Enable detailed metrics tracking for your Hikari Connection Pool
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

# (Optional) Enhances the health endpoint to show database connection status details
management.endpoint.health.show-details=always