server.port = 9000
spring.application.name=Product-Service
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql-db:3306/productservice?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id= my-group
spring.kafka.consumer.auto-offset-reset= earliest
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer= org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer= org.apache.kafka.common.serialization.StringSerializer

# ==========================================
# Actuator & Metrics Configuration
# ==========================================

# Expose the health check and prometheus metrics endpoints over the web
management.endpoints.web.exposure.include=health,prometheus

# Enable detailed metrics tracking for your Hikari Connection Pool
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

# (Optional) Enhances the health endpoint to show database connection status details
management.endpoint.health.show-details=always