spring.application.name=Order-Service
server.port=9001

spring.jpa.hibernate.ddl-auto=update    
spring.datasource.url=jdbc:mysql://mysql-db:3306/orderservice?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Actuator & Metrics Configuration
# ==========================================

# Expose the health check and prometheus metrics endpoints over the web
management.endpoints.web.exposure.include=health,prometheus

# Enable detailed metrics tracking for your Hikari Connection Pool
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

# (Optional) Enhances the health endpoint to show database connection status details
management.endpoint.health.show-details=always